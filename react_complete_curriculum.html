<p>React is just JavaScript. Understanding modern JS patterns — destructuring, spread, arrow functions, array methods, and async/await — means you'll read React code naturally instead of fighting the syntax.</p>
<p>The key concepts you must know before writing a single line of React:</p>

<p><strong>Destructuring</strong> — pull values out of objects and arrays cleanly. React uses this everywhere for props and state.</p>
<p><strong>Spread operator (...)</strong> — copy and merge arrays/objects without mutation. Core to state updates in React.</p>
<p><strong>Arrow functions</strong> — concise functions that inherit the surrounding <code>this</code>. Used in every component and event handler.</p>
<p><strong>Array methods</strong> — <code>.map()</code>, <code>.filter()</code>, <code>.find()</code>, <code>.reduce()</code>. Used to render lists, filter data, and transform state.</p>

<p><strong>Optional chaining (?.) & nullish coalescing (??)</strong> — safely access nested properties and provide fallback values.</p>
<p><strong>Promises & async/await</strong> — handle API calls. Every React data-fetching pattern is built on these.</p>
<p><strong>ES Modules (import/export)</strong> — the module system React components use.</p>
</div>

<span class="cmt">// { name: 'Priya', age: 28, city: 'Mumbai' }</span>

<div class="section-label">What is JSX?</div>
<div class="prose">
<p>JSX stands for JavaScript XML. It's a syntax extension that looks like HTML but lives inside <code>.jsx</code> files. React transforms it into regular function calls at build time using a compiler like Babel.</p>
</div>
<div class="analogy-box">JSX is like a template that JavaScript understands. Just as you'd write an HTML file but with variables, JSX lets you write markup with live JavaScript logic embedded using curly braces {}.</div>
<div class="section-label" style="margin-top:16px">Key JSX rules</div>
<div class="prose">
<p><strong>Return one root element</strong> — every component must return a single root. Wrap siblings in a <code>&lt;div&gt;</code> or the empty Fragment shorthand <code>&lt;&gt;&lt;/&gt;</code>.</p>
<p><strong>className, not class</strong> — <code>class</code> is a reserved word in JS, so JSX uses <code>className</code>.</p>
<p><strong>camelCase attributes</strong> — HTML's <code>onclick</code> becomes <code>onClick</code>, <code>tabindex</code> becomes <code>tabIndex</code>.</p>
<p><strong>Close all tags</strong> — even self-closing ones: <code>&lt;img /&gt;</code>, <code>&lt;input /&gt;</code>.</p>
<p><strong>Curly braces {} for JavaScript</strong> — any JS expression goes inside {}. Statements (if, for) don't; use ternaries and .map() instead.</p>
<p><strong>Comments</strong> — use <code>{/* comment */}</code> inside JSX.</p>
</div>
    `,
    code: `<span class="cmt">// JSX compiles to this under the hood:</span>
<span class="cmt">// React.createElement('h1', { className: 'title' }, 'Hello')</span>
<span class="cmt">// — but we write JSX instead, which is far more readable.</span>

<span class="kw">const</span> product = { name: <span class="str">'Laptop'</span>, price: 999, inStock: <span class="kw">true</span> };

      <span class="tag">&lt;/button&gt;</span>
    <span class="tag">&lt;/div&gt;</span>
  );
}`,

    concept: `
<div class="section-label">The component mental model</div>
<div class="prose">
<p>Think of a React app as a tree of components — like a hierarchy of Lego pieces, each responsible for one part of the UI. You compose them together to build complex interfaces.</p>
<p>There are two types of components you'll encounter: <strong>function components</strong> (what we use in modern React) and class components (legacy — you only need to recognise them in old codebases).</p>
</div>
<div class="analogy-box">Components are like custom HTML tags you define yourself. Just as <code>&lt;button&gt;</code> always renders a button, your <code>&lt;ProductCard&gt;</code> always renders your product card, wherever you use it.</div>
<div class="section-label" style="margin-top:16px">Component rules</div>
<div class="prose">
<p><strong>Name must start with a capital letter</strong> — React distinguishes <code>&lt;div&gt;</code> (HTML) from <code>&lt;Div&gt;</code> (your component) by case.</p>
<p><strong>One component per file</strong> (convention) — name the file the same as the component.</p>
<p><strong>Composability</strong> — components can contain other components. This is the core of React's power.</p>
<p><strong>Project map:</strong> Our TaskManager app will have: <code>&lt;App&gt;</code> → <code>&lt;Header&gt;</code>, <code>&lt;TaskList&gt;</code> → <code>&lt;TaskItem&gt;</code>, <code>&lt;AddTaskForm&gt;</code>.</p>
</div>
    `,
    code: `<span class="cmt">// ── Atomic component (no children, presentational) ──</span>
<span class="kw">function</span> <span class="fn">Badge</span>({ label, color }) {
  <span class="kw">return</span> (
    <span class="tag">&lt;span</span> <span class="attr">style</span>={{ background: color, padding: <span class="str">'4px 8px'</span>, borderRadius: <span class="str">'12px'</span> }}<span class="tag">&gt;</span>
      {label}
    <span class="tag">&lt;/span&gt;</span>
  );
}

<span class="cmt">// ── Composite component (contains other components) ──</span>
<span class="kw">function</span> <span class="fn">TaskItem</span>({ task }) {
  <span class="kw">return</span> (
    <span class="tag">&lt;div</span> <span class="attr">className</span>=<span class="str">"task-item"</span><span class="tag">&gt;</span>
      <span class="tag">&lt;h3&gt;</span>{task.title}<span class="tag">&lt;/h3&gt;</span>

    <span class="tag">&lt;/div&gt;</span>
  );

<span class="cmt">// ── List component (renders a collection) ──</span>

    subtitle: "Props (properties) are how parent components send data to child components. They flow in one direction: parent → child.",
    tabs: ["concept", "code", "exercise"],
    concept: `
<div class="section-label">What are props?</div>
<div class="prose">
<p>Props are arguments you pass to a component — just like function arguments. They let you make a component dynamic and reusable, showing different content based on the data it receives.</p>
<p>Props are <strong>read-only</strong>. A child component can never modify the props it receives. This is fundamental to React's predictability.</p>
</div>
<div class="analogy-box">Props are like the settings you pass into a TV — you decide the channel (prop), and the TV displays accordingly. The TV itself doesn't change the channel input — it just reads and displays it.</div>
<div class="section-label" style="margin-top:16px">Key patterns</div>
<div class="prose">
<p><strong>Destructuring props</strong> — rather than accessing <code>props.name</code>, destructure in the function signature for cleaner code.</p>

<div class="section-label">What is state?</div>
<div class="prose">
<p>While props are data passed in from outside, state is data that the component owns and controls. It's what makes a UI interactive — when state changes, the component re-renders with the new value.</p>
<p><code>useState</code> is the hook that lets function components hold state. It returns a pair: the current value and a function to update it.</p>

<div class="analogy-box">State is like a whiteboard inside the component — the component can write on it and erase it, and every time it changes, the component looks at the whiteboard again and re-renders accordingly.</div>
<div class="section-label" style="margin-top:16px">Rules of state</div>
<div class="prose">
<p><strong>Never mutate state directly</strong> — always use the setter function. <code>state.push(item)</code> will NOT cause a re-render. <code>setState([...state, item])</code> will.</p>
<p><strong>State updates are asynchronous</strong> — don't read state immediately after setting it. The new value is available in the next render.</p>
<p><strong>Functional updates</strong> — when new state depends on old state, use the callback form: <code>setCount(prev => prev + 1)</code>. This is safer when multiple updates happen in one event.</p>
<p><strong>Lifting state up</strong> — when two siblings need the same state, move it to their nearest common ancestor and pass it down as props.</p>
</div>

<div class="section-label">What is a side effect?</div>
<div class="prose">

<div class="prose">
<p>The second argument to <code>useEffect</code> controls when it runs:</p>

<p><strong>Empty array []</strong> — runs only once after the first render. Perfect for initial data fetching.</p>
<p><strong>[dep1, dep2]</strong> — runs after renders where dep1 or dep2 changed. Use when an effect should re-run based on specific values.</p>
<p><strong>Cleanup function</strong> — return a function from useEffect to clean up subscriptions, timers, or event listeners. This runs before the component unmounts or before the effect re-runs.</p>

<div class="section-label">Why custom hooks?</div>
<div class="prose">
<p>As your app grows, you'll notice patterns repeating: "fetch data and show loading/error", "track window size", "manage form inputs", "debounce a value". Custom hooks let you extract this logic into a single reusable function.</p>
<p>A custom hook is just a function whose name starts with <code>use</code> and that calls other hooks inside it. That's it — no special API, just a naming convention that tells React (and ESLint) to enforce the rules of hooks on it.</p>

    code: `<span class="cmt">// ── useFetch — reusable data fetching ──</span>
<span class="kw">function</span> <span class="fn">useFetch</span>(url) {
  <span class="kw">const</span> [data, setData]       = <span class="fn">useState</span>(<span class="kw">null</span>);
  <span class="kw">const</span> [loading, setLoading] = <span class="fn">useState</span>(<span class="kw">true</span>);
  <span class="kw">const</span> [error, setError]     = <span class="fn">useState</span>(<span class="kw">null</span>);

  <span class="fn">useEffect</span>(() => {
    <span class="kw">const</span> controller = <span class="kw">new</span> <span class="fn">AbortController</span>();
    <span class="fn">setLoading</span>(<span class="kw">true</span>);

    <span class="fn">fetch</span>(url, { signal: controller.signal })
      .<span class="fn">then</span>(r => r.<span class="fn">json</span>())
      .<span class="fn">then</span>(setData)
      .<span class="fn">catch</span>(e => { <span class="kw">if</span> (e.name !== <span class="str">'AbortError'</span>) <span class="fn">setError</span>(e); })
      .<span class="fn">finally</span>(() => <span class="fn">setLoading</span>(<span class="kw">false</span>));

    <span class="kw">return</span> () => controller.<span class="fn">abort</span>();
  }, [url]);

  <span class="kw">return</span> { data, loading, error };
}

<span class="cmt">// ── useLocalStorage — persist state to localStorage ──</span>
<span class="kw">function</span> <span class="fn">useLocalStorage</span>(key, initialValue) {
  <span class="kw">const</span> [value, setValue] = <span class="fn">useState</span>(() => {
    <span class="kw">try</span> {
      <span class="kw">const</span> item = localStorage.<span class="fn">getItem</span>(key);
      <span class="kw">return</span> item ? <span class="fn">JSON.parse</span>(item) : initialValue;
    } <span class="kw">catch</span> { <span class="kw">return</span> initialValue; }
  });

  <span class="kw">const</span> <span class="fn">setStoredValue</span> = (newValue) => {
    setValue(newValue);
    localStorage.<span class="fn">setItem</span>(key, <span class="fn">JSON.stringify</span>(newValue));
  };

  <span class="kw">return</span> [value, setStoredValue];
}

<span class="cmt">// ── useDebounce — delay a value update ──</span>
<span class="kw">function</span> <span class="fn">useDebounce</span>(value, delay = 300) {
  <span class="kw">const</span> [debounced, setDebounced] = <span class="fn">useState</span>(value);

  }, [value, delay]);
  <span class="kw">return</span> debounced;
}

<p>Imagine a user's theme preference needs to reach a deeply nested component. Without Context, you'd pass <code>theme</code> as a prop through every intermediate component — even ones that don't care about it. This is called prop drilling, and it makes code brittle and hard to refactor.</p>
<p>Context creates a "broadcast channel" — a provider at the top of the tree that any descendant can tune into directly.</p>
</div>

<div class="section-label">When React re-renders</div>
<div class="prose">
<p>React re-renders a component when: its state changes, its props change, or its parent re-renders. For most apps, this is fast enough. But as components multiply and data grows, unnecessary re-renders accumulate into noticeable lag.</p>
<p>The optimization tools all follow one principle: <strong>skip re-rendering if nothing relevant changed</strong>.</p>
</div>
<div class="analogy-box">Optimization is like caching. The first time you make a dish, you cook from scratch. Next time, if the recipe and ingredients haven't changed, you reheat the cached version. React.memo, useMemo, and useCallback are all forms of "don't recompute if the inputs are the same".</div>
<div class="section-label" style="margin-top:16px">The three tools</div>
<div class="prose">
<p><strong>React.memo</strong> — wraps a component. It will only re-render if its props actually changed (shallow comparison). Use on components that render often with the same props.</p>
<p><strong>useMemo</strong> — memoizes a computed value. Only recomputes when dependencies change. Use for expensive calculations (filtering thousands of items, complex transformations).</p>
<p><strong>useCallback</strong> — memoizes a function reference. Use when passing callbacks to memoized child components — otherwise the new function reference on every render defeats React.memo.</p>
<p><strong>React.lazy + Suspense</strong> — code-split routes and heavy components, loading them only when needed.</p>
<p><strong>Critical rule:</strong> Profile before optimizing. Don't add useMemo everywhere — it has overhead too. Use React DevTools Profiler to identify actual bottlenecks.</p>
</div>

<div class="section-label">When do you need Redux?</div>
<div class="prose">
<p>Context API works well for relatively static data (theme, auth). But for complex, high-frequency state with many interdependencies (a shopping cart shared across dozens of components, with optimistic updates, undo/redo, and server synchronisation), Redux provides a more structured solution.</p>
<p>Redux Toolkit (RTK) is the official, modern way to write Redux. It eliminates the notorious boilerplate of classic Redux by providing <code>createSlice</code> and <code>createAsyncThunk</code>.</p>
</div>
<div class="analogy-box">Redux is a single source of truth — one big, well-organized spreadsheet for your entire app. Every action is like an audit log entry: you can replay every change that happened, step by step. This is invaluable for debugging complex apps.</div>
<div class="section-label" style="margin-top:16px">Core concepts</div>
<div class="prose">
<p><strong>Store</strong> — the single object holding all global state.</p>
<p><strong>Slice</strong> — a section of the store with its own state, reducers, and actions. One slice per feature (tasksSlice, authSlice, cartSlice).</p>
<p><strong>Reducer</strong> — a pure function: (state, action) → newState. RTK uses Immer under the hood, so you can write "mutating" code that's actually immutable.</p>
<p><strong>Dispatch</strong> — the function you call to trigger a state change.</p>
<p><strong>Selector</strong> — a function that reads a specific piece of state from the store.</p>
</div>

<span class="cmt">// Async action — handles pending/fulfilled/rejected automatically</span>

<div class="section-label" style="margin-top:16px">Rendering strategies</div>

<p><strong>SSR (Server-Side Rendering)</strong> — page HTML is generated on the server for every request. Fresh data, great SEO. Good for: product pages, user dashboards, anything needing real-time data.</p>
<p><strong>SSG (Static Site Generation)</strong> — HTML is generated at build time. Blazing fast (served from CDN). Good for: blogs, marketing pages, documentation.</p>
<p><strong>ISR (Incremental Static Regeneration)</strong> — SSG with a revalidation interval. Pages rebuild in the background. Good for: e-commerce product pages (updated every 60s without a full rebuild).</p>
<p><strong>RSC (React Server Components)</strong> — App Router's default. Components render on the server, sending HTML + a minimal JS payload. Zero-bundle-size data fetching.</p>

<div class="section-label">Authentication patterns</div>
<div class="prose">
<p>Authentication in React apps typically works with tokens. The most common pattern is:</p>
<p>1. User submits credentials → Server validates → Returns a JWT (JSON Web Token).<br/>2. Client stores the JWT (httpOnly cookie is most secure; localStorage is simpler but XSS-vulnerable).<br/>3. Every subsequent API request includes the JWT in the Authorization header.<br/>4. The server validates the JWT on each request.</p>
<p>For modern apps, consider auth providers: NextAuth.js (open-source, works with any OAuth provider), Clerk, or Auth0 — they handle token management, refresh flows, and social login.</p>
</div>
<div class="section-label" style="margin-top:16px">Deployment checklist</div>
<div class="prose">
<p><strong>Environment variables</strong> — never hardcode API keys. Use .env.local for local dev, and set them in the hosting platform's dashboard for production.</p>
<p><strong>Vercel</strong> — the easiest Next.js deployment: connect your GitHub repo, push, and it's live. Automatic preview deployments for every PR.</p>
<p><strong>Performance</strong> — Lighthouse audit before launch. Target 90+ on all scores. Core Web Vitals (LCP, CLS, FID) affect SEO ranking.</p>
</div>
    `,
    code: `<span class="cmt">// ── Authentication with JWT + React Context ──</span>

<span class="cmt">// authService.ts — handles API calls</span>
<span class="kw">export async function</span> <span class="fn">login</span>(email: string, password: string) {
  <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">'/api/auth/login'</span>, {
    method: <span class="str">'POST'</span>,
    headers: { <span class="str">'Content-Type'</span>: <span class="str">'application/json'</span> },
    body: <span class="fn">JSON.stringify</span>({ email, password }),
  });
  <span class="kw">if</span> (!res.ok) <span class="kw">throw new</span> Error(<span class="str">'Invalid credentials'</span>);
  <span class="kw">return</span> res.<span class="fn">json</span>(); <span class="cmt">// { token, user }</span>
}

<span class="cmt">// AuthContext.tsx — manages auth state globally</span>
<span class="kw">export function</span> <span class="fn">AuthProvider</span>({ children }) {
  <span class="kw">const</span> [user, setUser] = <span class="fn">useState</span>(<span class="kw">null</span>);
  <span class="kw">const</span> [token, setToken] = <span class="fn">useState</span>(() => localStorage.<span class="fn">getItem</span>(<span class="str">'token'</span>));

  <span class="kw">const</span> <span class="fn">handleLogin</span> = <span class="kw">async</span> (email, password) => {
    <span class="kw">const</span> { token, user } = <span class="kw">await</span> <span class="fn">login</span>(email, password);
    localStorage.<span class="fn">setItem</span>(<span class="str">'token'</span>, token);
    <span class="fn">setToken</span>(token);
    <span class="fn">setUser</span>(user);
  };

  <span class="kw">const</span> <span class="fn">handleLogout</span> = () => {
    localStorage.<span class="fn">removeItem</span>(<span class="str">'token'</span>);
    <span class="fn">setToken</span>(<span class="kw">null</span>);
    <span class="fn">setUser</span>(<span class="kw">null</span>);
  };

  <span class="kw">return</span> (
    <span class="tag">&lt;AuthContext.Provider</span> <span class="attr">value</span>={{ user, token, login: handleLogin, logout: handleLogout }}<span class="tag">&gt;</span>
      {children}
    <span class="tag">&lt;/AuthContext.Provider&gt;</span>
  );
}

<span class="kw">import</span> jwt <span class="kw">from</span> <span class="str">'jsonwebtoken'</span>;

<span class="kw">export async function</span> <span class="fn">GET</span>(request) {
  <span class="kw">const</span> token = request.headers.<span class="fn">get</span>(<span class="str">'Authorization'</span>)?.replace(<span class="str">'Bearer '</span>, <span class="str">''</span>);
  <span class="kw">if</span> (!token) <span class="kw">return</span> NextResponse.<span class="fn">json</span>({ error: <span class="str">'Unauthorized'</span> }, { status: 401 });

  <span class="kw">try</span> {
    <span class="kw">const</span> user = jwt.<span class="fn">verify</span>(token, process.env.JWT_SECRET);
    <span class="kw">const</span> tasks = <span class="kw">await</span> db.tasks.<span class="fn">findMany</span>({ where: { userId: user.id } });
    <span class="kw">return</span> NextResponse.<span class="fn">json</span>(tasks);
  } <span class="kw">catch</span> {
    <span class="kw">return</span> NextResponse.<span class="fn">json</span>({ error: <span class="str">'Invalid token'</span> }, { status: 401 });
  }
}`,

let currentLesson = 0;
let currentTab = 'concept';

function getPhaseIdx(lesson) { return lesson.phase; }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '';
  let lastPhase = -1;

  LESSONS.forEach((lesson, i) => {
    if (lesson.phase !== lastPhase) {
      lastPhase = lesson.phase;
      const p = PHASES[lesson.phase];
      html += `<div class="sidebar-section"><div class="sidebar-phase">${p.label}</div>`;
    }
    const active = i === currentLesson ? ' active' : '';
    const color = PHASES[lesson.phase].color;
    html += `<div class="sidebar-item${active}" onclick="goTo(${i})"><span class="dot" style="background:${color}"></span>${lesson.title}</div>`;
    if (i === LESSONS.length - 1 || LESSONS[i+1]?.phase !== lesson.phase) html += '</div>';
  });

  sb.innerHTML = html;
}

function renderContent() {
  const lesson = LESSONS[currentLesson];
  const tab = currentTab;

  const badgeClass = `badge-${lesson.badge}`;
  const badgeLabel = lesson.badge.charAt(0).toUpperCase() + lesson.badge.slice(1);

  let tabContent = '';
  if (tab === 'concept') {
    tabContent = lesson.concept;
    if (lesson.usecase) {
      tabContent += `<div class="section-label" style="margin-top:16px">Real-world use cases</div><div style="margin-top:8px">`;
      lesson.usecase.forEach(u => { tabContent += `<span class="usecase-chip">${u}</span>`; });
      tabContent += '</div>';
    }
  } else if (tab === 'code') {
    tabContent = `<div class="section-label">Code example</div><div class="code-block">${lesson.code}</div>`;
    if (lesson.pitfalls) {
      tabContent += `<div class="section-label" style="margin-top:16px">Common pitfalls</div>`;
      lesson.pitfalls.forEach(p => { tabContent += `<div class="pitfall"><strong>Pitfall:</strong> ${p}</div>`; });
    }
    if (lesson.tips) {
      tabContent += `<div class="section-label" style="margin-top:16px">Pro tips</div>`;
      lesson.tips.forEach(t => { tabContent += `<div class="tip">${t}</div>`; });
    }
  } else if (tab === 'exercise') {
    tabContent = `<div class="exercise-box">
      <div class="exercise-title">${lesson.exercise.title}</div>
      <ul class="exercise-list">${lesson.exercise.items.map(item => `<li>${item}</li>`).join('')}</ul>
    </div>`;
  }

  const pct = Math.round(((currentLesson + 1) / LESSONS.length) * 100);

  document.getElementById('prog').style.width = pct + '%';

  document.getElementById('content').innerHTML = `
    <div class="lesson-header">
      <span class="lesson-badge ${badgeClass}">${badgeLabel}</span>
      <h1 class="lesson-title">${lesson.title}</h1>
      <p class="lesson-subtitle">${lesson.subtitle}</p>
    </div>
    <div class="tabs">
      ${lesson.tabs.map(t => `<div class="tab ${t === tab ? 'active' : ''}" onclick="switchTab('${t}')">${t.charAt(0).toUpperCase() + t.slice(1)}</div>`).join('')}
    </div>
    <div>${tabContent}</div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="goTo(${currentLesson - 1})" ${currentLesson === 0 ? 'disabled' : ''}>← Previous</button>
      <span style="font-size:12px;color:var(--color-text-tertiary);align-self:center">${currentLesson + 1} / ${LESSONS.length}</span>
      ${currentLesson < LESSONS.length - 1
        ? `<button class="nav-btn primary" onclick="goTo(${currentLesson + 1})">Next →</button>`
        : `<button class="nav-btn primary" onclick="sendPrompt('I\'ve finished all the lessons! What should I build next to solidify my React skills?')">I\'m done! What next? ↗</button>`}
    </div>
  `;
}

function goTo(idx) {
  if (idx < 0 || idx >= LESSONS.length) return;
  currentLesson = idx;
  currentTab = 'concept';
  renderSidebar();
  renderContent();
  document.getElementById('content').scrollTop = 0;
}

function switchTab(tab) {
  currentTab = tab;
  renderContent();
}

renderSidebar();
renderContent();
</script>
